<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oryxgen AI Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-orb"></div>
        <span class="brand-title">Oryxgen AI</span>
        <span class="status-badge" id="statusBadge">Live</span>
      </div>
      <div class="model-select-wrapper">
        <select id="modelSelect" class="model-select" title="Modelni tanlang">
          <option value="claude-sonnet-5.5">Claude Sonnet 5.5</option>
          <option value="claude-opus-5.5">Claude Opus 5.5</option>
          <option value="nvidia/nemotron-3-ultra-550b-a55b">Nemotron 3 Ultra 550B</option>
          <option value="nvidia/nemotron-3-super-120b-a12b">Nemotron 3 Super 120B</option>
          <option value="nvidia/nemotron-3.5-super-vl-120b-a12b">Nemotron 3.5 Vision 120B</option>
          <option value="nvidia/nemotron-3.5-lightning-30b-a3b">Nemotron 3.5 Lightning 30B</option>
          <option value="deepseek-ai/deepseek-v4.1-flash">DeepSeek V4.1 Flash</option>
          <option value="google/gemma-4-31b-it">Google Gemma 4 31B</option>
          <option value="meta/llama-3.2-90b-vision-instruct">Llama 3.2 90B Vision</option>
          <option value="mistralai/mistral-large-2-instruct">Mistral Large 2</option>
          <option value="gpt-6-astra">GPT-6 Astra</option>
          <option value="gpt-6-sol">GPT-6 Sol</option>
        </select>
      </div>
    </header>

    <!-- Quick Action Pills -->
    <div class="quick-actions">
      <button class="pill-btn" id="btnSummarize">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Sahifani tahlil
      </button>
      <button class="pill-btn" id="btnFindErrors">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Xatolarni topish
      </button>
      <button class="pill-btn" id="btnExtract">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        Matnni olish
      </button>
      <button class="pill-btn" id="btnClear">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        Tozalash
      </button>
    </div>

    <!-- Active Tab Context Banner -->
    <div class="tab-context" id="tabContext">
      <span class="tab-label">Joriy sahifa:</span>
      <span class="tab-title" id="tabTitle">Yuklanmoqda...</span>
    </div>

    <!-- Chat Output Scroll Area -->
    <main class="chat-feed" id="chatFeed">
      <div class="message assistant welcome">
        <div class="msg-header">Oryxgen AI</div>
        <div class="msg-body">
          Assalomu alaykum! Men Oryxgen AI brauzer yordamchisiman. Ushbu sahifa bo'yicha savol bering, xatolarni tahlil qilishni yoki matnni tushuntirib berishni so'rang.
        </div>
      </div>
    </main>

    <!-- Prompt Input Form -->
    <footer class="footer">
      <form id="chatForm" class="chat-form">
        <textarea
          id="userInput"
          class="chat-input"
          rows="2"
          placeholder="Savol yoki brauzer buyrug'ini yozing (Ctrl+Enter yuborish)..."
        ></textarea>
        <button type="submit" id="sendBtn" class="send-btn" title="Yuborish">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
